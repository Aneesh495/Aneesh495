name: Project link checker tests
on:
  push:
    paths: ['scripts/**', '.github/workflows/checker-tests.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/checker-tests.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
