name: Update profile SVGs

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - generate.mjs
      - assets/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVGs
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh live profile telemetry [skip ci]"
          file_pattern: "dark.svg light.svg github-jet.svg"
