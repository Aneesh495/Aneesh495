<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Aneesh Krishna">
  <style>
    .name {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      font-size: 58px;
      font-weight: 400;
      fill: #E8E6E1;
    }
    .loc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.32em;
      fill: #8B949E;
    }
  </style>
  <rect width="1100" height="400" fill="#0d1117"/>
  <text class="loc" x="56" y="86">NEW YORK</text>
  <text class="name" x="56" y="200">Aneesh</text>
  <text class="name" x="56" y="268">Krishna</text>
  <g transform="translate(820 200)" fill="none">
    <circle cx="0" cy="0" r="6" fill="#E8E6E1"/>
    <g transform="rotate(0)">
      <g>
        <ellipse cx="0" cy="0" rx="148" ry="52" fill="none" stroke="#C9C4BA" stroke-width="1.35"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="rotate(60)">
      <g>
        <ellipse cx="0" cy="0" rx="148" ry="52" fill="none" stroke="#3D444D" stroke-width="1.1"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="rotate(120)">
      <g>
        <ellipse cx="0" cy="0" rx="148" ry="52" fill="none" stroke="#C9C4BA" stroke-width="1.2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="21s" repeatCount="indefinite"/>
      </g>
    </g>
    <g>
      <circle cx="148" cy="0" r="4" fill="#E8E6E1"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
